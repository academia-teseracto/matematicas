const lessons=[{"title": "Antes de empezar", "subtitle": "Coordenadas, sustitución y signos", "slides": [{"title": "¿Qué es una función?", "body": "Piensa en una máquina: introduces un número x, la máquina hace una operación y devuelve un número y. Si la regla es elevar al cuadrado, metes 3 y sale 9. No tienes que resolver ninguna incógnita: tú eliges x y calculas y.", "eq": "x = 3 → 3² = 9 → y = 9", "g": null, "tip": "Pregunta: si meto 2, ¿qué sale? 4."}, {"title": "Cómo colocar un punto", "body": "Un punto tiene dos números: (x, y). El primero indica izquierda o derecha; el segundo, abajo o arriba. Desde el origen (0, 0), ve dos unidades a la izquierda y cuatro hacia arriba.", "eq": "(−2, 4)", "g": {"h": 0, "k": 0, "a": 1, "stage": "single", "xs": [-2]}, "tip": "Que lo señale con el dedo: primero horizontal, después vertical."}, {"title": "El cuadrado de un negativo", "body": "Elevar al cuadrado significa multiplicar el número por sí mismo. Dos negativos multiplicados dan positivo. Pero si el signo menos está FUERA de la potencia, se aplica después.", "eq": "(−2)² = (−2)·(−2) = 4<br>−2² = −(2²) = −4", "g": null, "tip": "No confundir (−2)² con −(2²)."}, {"title": "Orden de las operaciones", "body": "Para y = (x − 2)² − 1 con x = 0: primero sustituyes, después resuelves el paréntesis, luego elevas al cuadrado y finalmente restas 1.", "eq": "y = (0 − 2)² − 1<br>y = (−2)² − 1<br>y = 4 − 1 = 3", "g": null, "tip": "Pide repetir el mismo procedimiento con x = 1: sale 0."}]}, {"title": "De una tabla a una parábola", "subtitle": "La curva y = x², punto por punto", "slides": [{"title": "Elige cinco valores de x", "body": "Para dibujar necesitamos puntos. Elegimos −2, −1, 0, 1 y 2. Estos valores son cómodos porque están alrededor de 0. Puedes elegir otros números; no son los únicos posibles.", "eq": "y = x²", "g": {"h": 0, "k": 0, "a": 1, "stage": "empty", "xs": [-2, -1, 0, 1, 2]}, "tip": "Haz una tabla de dos filas en el cuaderno."}, {"title": "Calculamos el punto 1 de 5", "body": "Sustituimos x por −2. Multiplicamos el número por sí mismo. La pareja (x, y) es la posición que se marca en el plano.", "eq": "y = (−2)² = 4 → (−2, 4)", "g": {"h": 0, "k": 0, "a": 1, "stage": "points", "xs": [-2]}, "tip": "Observa cómo se añade un punto, no una recta."}, {"title": "Calculamos el punto 2 de 5", "body": "Sustituimos x por −1. Multiplicamos el número por sí mismo. La pareja (x, y) es la posición que se marca en el plano.", "eq": "y = (−1)² = 1 → (−1, 1)", "g": {"h": 0, "k": 0, "a": 1, "stage": "points", "xs": [-2, -1]}, "tip": "Observa cómo se añade un punto, no una recta."}, {"title": "Calculamos el punto 3 de 5", "body": "Sustituimos x por 0. Multiplicamos el número por sí mismo. La pareja (x, y) es la posición que se marca en el plano.", "eq": "y = 0² = 0 → (0, 0)", "g": {"h": 0, "k": 0, "a": 1, "stage": "points", "xs": [-2, -1, 0]}, "tip": "Observa cómo se añade un punto, no una recta."}, {"title": "Calculamos el punto 4 de 5", "body": "Sustituimos x por 1. Multiplicamos el número por sí mismo. La pareja (x, y) es la posición que se marca en el plano.", "eq": "y = 1² = 1 → (1, 1)", "g": {"h": 0, "k": 0, "a": 1, "stage": "points", "xs": [-2, -1, 0, 1]}, "tip": "Observa cómo se añade un punto, no una recta."}, {"title": "Calculamos el punto 5 de 5", "body": "Sustituimos x por 2. Multiplicamos el número por sí mismo. La pareja (x, y) es la posición que se marca en el plano.", "eq": "y = 2² = 4 → (2, 4)", "g": {"h": 0, "k": 0, "a": 1, "stage": "points", "xs": [-2, -1, 0, 1, 2]}, "tip": "Observa cómo se añade un punto, no una recta."}, {"title": "Unimos los puntos con una curva", "body": "Ahora aparece la forma de U. No unas con segmentos rectos: la función pasa también por infinitos puntos intermedios. Las ramas continúan fuera del dibujo.", "eq": "y = x²", "g": {"h": 0, "k": 0, "a": 1, "stage": "curve", "xs": [-2, -1, 0, 1, 2]}, "tip": "Pregunta: si x = 3, ¿qué altura obtengo? 9."}]}, {"title": "Vértice y simetría", "subtitle": "Encuentra el giro y el espejo", "slides": [{"title": "El vértice es el punto de giro", "body": "En una parábola que abre hacia arriba, el vértice es el punto más bajo. Aquí ningún cuadrado puede ser menor que 0. Cuando x = 0, y = 0. El vértice es una pareja, no un solo número.", "eq": "V(0, 0) · mínimo = 0", "g": {"h": 0, "k": 0, "a": 1, "stage": "vertex", "xs": [-2, -1, 0, 1, 2]}, "tip": "El mínimo es la altura y del vértice."}, {"title": "La línea que divide la curva", "body": "Los puntos (−2, 4) y (2, 4) tienen la misma altura. Lo mismo sucede con (−1, 1) y (1, 1). La línea vertical que hace de espejo pasa por el vértice.", "eq": "Eje de simetría: x = 0", "g": {"h": 0, "k": 0, "a": 1, "stage": "symmetry", "xs": [-2, -1, 0, 1, 2]}, "tip": "El eje de simetría es una recta vertical, no un punto."}, {"title": "Si la parábola está boca abajo", "body": "Un signo negativo delante del cuadrado refleja la curva verticalmente. El vértice ahora es el punto más alto, un máximo.", "eq": "y = −x² + 4 · V(0, 4)", "g": {"h": 0, "k": 4, "a": -1, "stage": "vertex", "xs": [-2, -1, 0, 1, 2]}, "tip": "El signo de delante del cuadrado decide la apertura."}]}, {"title": "Movemos la parábola", "subtitle": "Comprender (x − 2)² − 1 sin memorizar signos", "slides": [{"title": "La curva original", "body": "Partimos de y = x². Su punto de giro está en el origen. Vamos a trasladar toda la curva, no a cambiar su forma.", "eq": "y = x²", "g": {"h": 0, "k": 0, "a": 1, "stage": "vertex", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}, {"title": "Dos unidades a la derecha", "body": "En (x − 2)², buscamos qué número hace que el paréntesis sea cero. No es −2: es 2, porque 2 − 2 = 0. Toda la curva se desplaza a la derecha.", "eq": "y = (x − 2)² → V(2, 0)", "g": {"h": 2, "k": 0, "a": 1, "stage": "shift", "xs": [0, 1, 2, 3, 4], "ghost": [0, 0, 1]}, "tip": "No memorices el signo: iguala el paréntesis a cero."}, {"title": "Una unidad hacia abajo", "body": "El −1 de fuera resta uno a todas las alturas. El punto más bajo pasa de (2, 0) a (2, −1).", "eq": "y = (x − 2)² − 1 → V(2, −1)", "g": {"h": 2, "k": -1, "a": 1, "stage": "shift", "xs": [0, 1, 2, 3, 4], "ghost": [2, 0, 1]}, "tip": "Dentro afecta a x; fuera afecta a y."}, {"title": "Encuentra el vértice sin dibujar", "body": "Primero x − 2 = 0, de donde x = 2. Luego sustituye ese 2 en la función: (2 − 2)² − 1 = −1. Ya tienes las dos coordenadas. El eje vertical pasa por x = 2.", "eq": "V(2, −1) · eje x = 2", "g": {"h": 2, "k": -1, "a": 1, "stage": "symmetry", "xs": [0, 1, 2, 3, 4]}, "tip": "Si fuera (x + 1)², el paréntesis vale cero en x = −1."}]}, {"title": "Dominio y recorrido", "subtitle": "Horizontal frente a vertical", "slides": [{"title": "Dominio: qué puedo meter", "body": "Pregunta: ¿existe algún número que no pueda introducir como x? En esta expresión solo hay restas y un cuadrado. Cualquier real se puede usar, incluidos negativos, decimales y cero.", "eq": "D = ℝ = (−∞, +∞)", "g": {"h": 2, "k": -1, "a": 1, "stage": "domain", "xs": [0, 1, 2, 3, 4]}, "tip": "Recorre con el dedo el eje horizontal. No confundas lo que se ve en pantalla con todos los valores posibles."}, {"title": "Recorrido: qué puede salir", "body": "El cuadrado nunca es negativo. Su mínimo es 0; al restar 1, la altura más baja posible es −1. La curva alcanza −1 y todas las alturas superiores. No existe ningún punto por debajo.", "eq": "R = [−1, +∞)", "g": {"h": 2, "k": -1, "a": 1, "stage": "range", "xs": [0, 1, 2, 3, 4]}, "tip": "Desplaza el dedo de abajo arriba por el eje Y."}, {"title": "Cuando abre hacia abajo", "body": "Si y = −x² + 4, el cuadrado es ≥ 0, por tanto −x² es ≤ 0. La altura máxima es 4, y todas las alturas inferiores son posibles.", "eq": "D = ℝ · R = (−∞, 4]", "g": {"h": 0, "k": 4, "a": -1, "stage": "range", "xs": [-2, -1, 0, 1, 2]}, "tip": "Los corchetes incluyen el extremo alcanzado. El infinito siempre lleva paréntesis."}, {"title": "Compara con una recta", "body": "La recta y = 2x − 5 no tiene un máximo ni un mínimo. A medida que avanzas, puedes alcanzar cualquier altura. La parábola sí tiene un límite vertical, aunque las dos admiten cualquier x.", "eq": "Recta: D = ℝ, R = ℝ<br>Parábola: D = ℝ, R = [−1, +∞)", "g": {"h": 2, "k": -1, "a": 1, "stage": "compare", "xs": [0, 1, 2, 3, 4]}, "tip": "Dominio: x. Recorrido: y."}]}, {"title": "Cortes con los ejes", "subtitle": "Cuál coordenada debe ser cero", "slides": [{"title": "Corte con Y: x = 0", "body": "El eje Y es vertical. Cualquier punto sobre él tiene x = 0. Sustituimos x por 0 para hallar la altura exacta a la que la curva toca ese eje.", "eq": "y = (0 − 2)² − 1 = 4 − 1 = 3<br>Corte Y: (0, 3)", "g": {"h": 2, "k": -1, "a": 1, "stage": "cutY", "xs": [0, 1, 2, 3, 4]}, "tip": "El corte con Y nunca se escribe (3, 0) en este caso."}, {"title": "Corte con X: y = 0", "body": "El eje X es horizontal. Cualquier punto que esté sobre él tiene altura cero. Sustituimos y por 0 y ahora sí debemos encontrar la x que hace verdadera la igualdad.", "eq": "0 = (x − 2)² − 1", "g": {"h": 2, "k": -1, "a": 1, "stage": "cutX", "xs": [0, 1, 2, 3, 4]}, "tip": "¿Qué dos puntos de la tabla tienen altura cero?"}, {"title": "Despeja el cuadrado", "body": "Sumamos 1 a los dos lados para eliminar el −1 de la derecha. Ahora preguntamos qué número al cuadrado da 1. Hay dos: 1 y −1.", "eq": "(x − 2)² = 1<br>x − 2 = 1  o  x − 2 = −1", "g": {"h": 2, "k": -1, "a": 1, "stage": "cutX", "xs": [0, 1, 2, 3, 4]}, "tip": "El ± aparece al resolver una ecuación cuadrada, no al calcular un cuadrado."}, {"title": "Resuelve las dos posibilidades", "body": "En cada caso sumamos 2 a ambos lados. La primera da x = 3; la segunda, x = 1. Ambas son correctas. Como buscamos el eje X, y es cero en los dos puntos.", "eq": "x = 3 o x = 1<br>Cortes X: (1, 0) y (3, 0)", "g": {"h": 2, "k": -1, "a": 1, "stage": "cuts", "xs": [0, 1, 2, 3, 4]}, "tip": "Comprueba sustituyendo 1 y 3 en la función."}, {"title": "A veces no hay cortes con X", "body": "En y = (x − 3)² + 1, la altura mínima es 1. Toda la parábola está por encima del eje X. La ecuación de corte pediría un cuadrado igual a −1, imposible en los reales.", "eq": "(x − 3)² = −1 → no hay solución real", "g": {"h": 3, "k": 1, "a": 1, "stage": "cuts", "xs": [1, 2, 3, 4, 5]}, "tip": "Si el vértice estuviera exactamente en y = 0, habría un único corte con X."}]}, {"title": "Dos formas, una misma curva", "subtitle": "Desarrollar y reconstruir el cuadrado", "slides": [{"title": "Qué significa elevar un paréntesis al cuadrado", "body": "No significa elevar cada término por separado. Es multiplicar el paréntesis entero por sí mismo. Distribuye: cada término del primero multiplica a cada término del segundo.", "eq": "(x − 2)² = (x − 2)(x − 2)<br>= x² − 2x − 2x + 4", "g": null, "tip": "Error típico: (x − 2)² no es x² + 4."}, {"title": "Junta términos semejantes", "body": "Los dos términos −2x suman −4x. Después todavía tenemos que restar 1, tal como decía la función original.", "eq": "(x − 2)² − 1<br>= x² − 4x + 4 − 1<br>= x² − 4x + 3", "g": {"h": 2, "k": -1, "a": 1, "stage": "curve", "xs": [0, 1, 2, 3, 4]}, "tip": "Las dos fórmulas representan exactamente los mismos puntos."}, {"title": "Si te dan la forma desarrollada", "body": "En estos ejemplos, el coeficiente de x² es 1. Toma la mitad del coeficiente de x: la mitad de −4 es −2. Construye (x − 2)². Al desarrollarlo aparece +4; para recuperar el +3 original, resta 1.", "eq": "x² − 4x + 3 = x² − 4x + 4 − 1<br>= (x − 2)² − 1", "g": {"h": 2, "k": -1, "a": 1, "stage": "vertex", "xs": [0, 1, 2, 3, 4]}, "tip": "Este atajo de tomar la mitad directamente es para coeficiente de x² igual a 1. No hace falta usar −b/(2a) todavía."}]}, {"title": "Ejemplos completos guiados", "subtitle": "Los dos ejemplos de la ficha original, sin saltos", "slides": [{"title": "A · Prepara la tabla", "body": "Para y = (x − 2)² − 1, el paréntesis se anula en x = 2. Escogemos dos números a cada lado: 0, 1, 2, 3, 4.", "eq": "y = (x − 2)² − 1", "g": {"h": 2, "k": -1, "a": 1, "stage": "empty", "xs": [0, 1, 2, 3, 4]}, "tip": ""}, {"title": "A · Sustituye x = 0", "body": "Primero calcula 0 − 2, luego su cuadrado y finalmente resta 1. Marca el punto obtenido.", "eq": "y = (0 − 2)² − 1<br>= (−2)² − 1 = 4 − 1 = 3", "g": {"h": 2, "k": -1, "a": 1, "stage": "points", "xs": [0]}, "tip": ""}, {"title": "A · Sustituye x = 1", "body": "Primero calcula 1 − 2, luego su cuadrado y finalmente resta 1. Marca el punto obtenido.", "eq": "y = (1 − 2)² − 1<br>= (−1)² − 1 = 1 − 1 = 0", "g": {"h": 2, "k": -1, "a": 1, "stage": "points", "xs": [0, 1]}, "tip": ""}, {"title": "A · Sustituye x = 2", "body": "Primero calcula 2 − 2, luego su cuadrado y finalmente resta 1. Marca el punto obtenido.", "eq": "y = (2 − 2)² − 1<br>= (0)² − 1 = 0 − 1 = −1", "g": {"h": 2, "k": -1, "a": 1, "stage": "points", "xs": [0, 1, 2]}, "tip": ""}, {"title": "A · Sustituye x = 3", "body": "Primero calcula 3 − 2, luego su cuadrado y finalmente resta 1. Marca el punto obtenido.", "eq": "y = (3 − 2)² − 1<br>= (1)² − 1 = 1 − 1 = 0", "g": {"h": 2, "k": -1, "a": 1, "stage": "points", "xs": [0, 1, 2, 3]}, "tip": ""}, {"title": "A · Sustituye x = 4", "body": "Primero calcula 4 − 2, luego su cuadrado y finalmente resta 1. Marca el punto obtenido.", "eq": "y = (4 − 2)² − 1<br>= (2)² − 1 = 4 − 1 = 3", "g": {"h": 2, "k": -1, "a": 1, "stage": "points", "xs": [0, 1, 2, 3, 4]}, "tip": ""}, {"title": "A · Vértice, eje y apertura", "body": "El punto de giro es (2, −1). El eje vertical es x = 2. El cuadrado tiene coeficiente positivo, por lo que abre hacia arriba.", "eq": "V(2, −1) · eje x = 2", "g": {"h": 2, "k": -1, "a": 1, "stage": "symmetry", "xs": [0, 1, 2, 3, 4]}, "tip": ""}, {"title": "A · Cortes", "body": "Para Y ponemos x = 0: sale y = 3. Para X ponemos y = 0: (x − 2)² = 1, así que x − 2 = 1 o −1, y x = 3 o 1.", "eq": "Y: (0, 3) · X: (1, 0), (3, 0)", "g": {"h": 2, "k": -1, "a": 1, "stage": "cuts", "xs": [0, 1, 2, 3, 4]}, "tip": ""}, {"title": "A · Dominio y recorrido", "body": "Todos los números reales sirven como x. La menor altura es −1 y la parábola abre arriba.", "eq": "D = ℝ · R = [−1, +∞)", "g": {"h": 2, "k": -1, "a": 1, "stage": "range", "xs": [0, 1, 2, 3, 4]}, "tip": ""}, {"title": "B · La parábola invertida", "body": "Ahora y = −x² + 4. Primero elevamos x al cuadrado, después cambiamos el signo y sumamos 4. Para x = −2, −(−2)² + 4 = −4 + 4 = 0.", "eq": "y = −x² + 4", "g": {"h": 0, "k": 4, "a": -1, "stage": "empty", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}, {"title": "B · Sustituye x = −2", "body": "Eleva al cuadrado antes de aplicar el signo negativo exterior. Suma 4 para obtener la altura.", "eq": "y = −(−2)² + 4<br>= −4 + 4 = 0", "g": {"h": 0, "k": 4, "a": -1, "stage": "points", "xs": [-2]}, "tip": ""}, {"title": "B · Sustituye x = −1", "body": "Eleva al cuadrado antes de aplicar el signo negativo exterior. Suma 4 para obtener la altura.", "eq": "y = −(−1)² + 4<br>= −1 + 4 = 3", "g": {"h": 0, "k": 4, "a": -1, "stage": "points", "xs": [-2, -1]}, "tip": ""}, {"title": "B · Sustituye x = 0", "body": "Eleva al cuadrado antes de aplicar el signo negativo exterior. Suma 4 para obtener la altura.", "eq": "y = −(0)² + 4<br>= −0 + 4 = 4", "g": {"h": 0, "k": 4, "a": -1, "stage": "points", "xs": [-2, -1, 0]}, "tip": ""}, {"title": "B · Sustituye x = 1", "body": "Eleva al cuadrado antes de aplicar el signo negativo exterior. Suma 4 para obtener la altura.", "eq": "y = −(1)² + 4<br>= −1 + 4 = 3", "g": {"h": 0, "k": 4, "a": -1, "stage": "points", "xs": [-2, -1, 0, 1]}, "tip": ""}, {"title": "B · Sustituye x = 2", "body": "Eleva al cuadrado antes de aplicar el signo negativo exterior. Suma 4 para obtener la altura.", "eq": "y = −(2)² + 4<br>= −4 + 4 = 0", "g": {"h": 0, "k": 4, "a": -1, "stage": "points", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}, {"title": "B · Vértice y máximo", "body": "La curva abre hacia abajo y su altura mayor es 4, cuando x = 0. La recta que la divide es x = 0.", "eq": "V(0, 4) · máximo 4 · eje x = 0", "g": {"h": 0, "k": 4, "a": -1, "stage": "symmetry", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}, {"title": "B · Cortes (ampliación guiada)", "body": "Para Y, x = 0 y sale 4. Para X, 0 = −x² + 4, sumamos x² a ambos lados y obtenemos x² = 4. Los números cuyo cuadrado es 4 son 2 y −2.", "eq": "Y: (0, 4) · X: (−2, 0), (2, 0)", "g": {"h": 0, "k": 4, "a": -1, "stage": "cuts", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}, {"title": "B · Dominio y recorrido", "body": "Cualquier x real se puede elevar al cuadrado. El signo negativo impide que la altura sea mayor que 4. El 4 sí se alcanza.", "eq": "D = ℝ · R = (−∞, 4]", "g": {"h": 0, "k": 4, "a": -1, "stage": "range", "xs": [-2, -1, 0, 1, 2]}, "tip": ""}]}], exercises=[{"group": "Práctica", "q": "1. Completa la tabla de y = (x − 1)² − 4 para x = −1, 0, 1, 2, 3. Da vértice y mínimo.", "hint": "Sustituye cada x; busca el número que hace cero el paréntesis.", "steps": ["x = −1: (−1 − 1)² − 4 = (−2)² − 4 = 0.", "x = 0: (0 − 1)² − 4 = 1 − 4 = −3.", "x = 1: (1 − 1)² − 4 = 0 − 4 = −4.", "x = 2: (2 − 1)² − 4 = 1 − 4 = −3.", "x = 3: (3 − 1)² − 4 = 4 − 4 = 0.", "V(1, −4). Abre arriba: mínimo −4. Recorrido [−4, +∞)."], "g": {"h": 1, "k": -4, "a": 1, "stage": "symmetry", "xs": [-1, 0, 1, 2, 3]}}, {"group": "Práctica", "q": "2. Dibuja cinco puntos de y = −x² + 4. Señala vértice y máximo.", "hint": "Elige valores a ambos lados de 0. Cuadrado antes del signo menos.", "steps": ["x = −2: −(−2)² + 4 = 0.", "x = −1: −(−1)² + 4 = 3.", "x = 0: −0² + 4 = 4.", "x = 1: −1² + 4 = 3.", "x = 2: −2² + 4 = 0.", "Marca (−2,0), (−1,3), (0,4), (1,3), (2,0). V(0,4); máximo 4."], "g": {"h": 0, "k": 4, "a": -1, "stage": "vertex", "xs": [-2, -1, 0, 1, 2]}}, {"group": "Práctica", "q": "3. Comprueba que x² − 4x + 3 = (x − 2)² − 1 y calcula todos los cortes.", "hint": "Desarrolla el paréntesis. Para Y usa x = 0 y para X usa y = 0.", "steps": ["(x − 2)(x − 2) − 1 = x² − 2x − 2x + 4 − 1 = x² − 4x + 3.", "Y: x = 0 → 0² − 4·0 + 3 = 3 → (0,3).", "X: 0 = (x − 2)² − 1 → (x − 2)² = 1.", "x − 2 = ±1 → x = 3 o x = 1. Cortes (1,0) y (3,0).", "Alternativa de la guía: (x − 1)(x − 3) = 0 → uno de los factores debe ser cero."], "g": {"h": 2, "k": -1, "a": 1, "stage": "cuts", "xs": [0, 1, 2, 3, 4]}}, {"group": "Práctica", "q": "4. Compara dominio y recorrido de y = 2x − 5 y y = (x − 2)² − 1.", "hint": "Dominio: x permitidas; recorrido: alturas y alcanzadas.", "steps": ["En las dos expresiones se puede introducir cualquier x real: D = ℝ.", "La recta no tiene límite vertical: R = ℝ. Para cualquier y puedes despejar x = (y + 5)/2.", "La parábola tiene V(2, −1), abre arriba y no baja de −1: R = [−1, +∞)."], "g": {"h": 2, "k": -1, "a": 1, "stage": "compare", "xs": [0, 1, 2, 3, 4]}}, {"group": "Práctica", "q": "5. Corrige: «Si V(2, −1), el recorrido empieza en 2».", "hint": "¿Cuál de las dos coordenadas indica altura?", "steps": ["2 es la coordenada x, horizontal.", "−1 es la coordenada y, vertical.", "Si abre arriba, R = [−1, +∞); si abre abajo, R = (−∞, −1]. Solo el vértice no dice hacia dónde abre. En la parábola de la ficha abre arriba."], "g": {"h": 2, "k": -1, "a": 1, "stage": "range", "xs": [0, 1, 2, 3, 4]}}, {"group": "Minicontrol", "q": "1. y = (x + 1)² − 4: halla vértice y recorrido.", "hint": "Busca cuándo el paréntesis vale 0.", "steps": ["x + 1 = 0 → x = −1.", "y = (−1 + 1)² − 4 = −4.", "V(−1, −4); abre arriba: R = [−4, +∞)."], "g": {"h": -1, "k": -4, "a": 1, "stage": "range", "xs": [-3, -2, -1, 0, 1]}}, {"group": "Minicontrol", "q": "2. y = x² − 4: escribe cinco puntos simétricos y el mínimo.", "hint": "El centro está en x = 0.", "steps": ["x = −2: 4 − 4 = 0; x = −1: 1 − 4 = −3.", "x = 0: 0 − 4 = −4.", "x = 1: 1 − 4 = −3; x = 2: 4 − 4 = 0.", "Puntos (−2,0), (−1,−3), (0,−4), (1,−3), (2,0). Mínimo −4 en x = 0."], "g": {"h": 0, "k": -4, "a": 1, "stage": "symmetry", "xs": [-2, -1, 0, 1, 2]}}, {"group": "Minicontrol", "q": "3. y = −(x − 1)² + 4: encuentra los cortes con X y con Y.", "hint": "Para X iguala y a cero; para Y sustituye x por cero.", "steps": ["0 = −(x − 1)² + 4 → (x − 1)² = 4.", "x − 1 = 2 o −2 → x = 3 o −1.", "Cortes X: (−1,0), (3,0).", "Y: −(0 − 1)² + 4 = −1 + 4 = 3 → (0,3)."], "g": {"h": 1, "k": 4, "a": -1, "stage": "cuts", "xs": [-1, 0, 1, 2, 3]}}, {"group": "Minicontrol", "q": "4. y = x² − 2x − 3: escribe la forma (x − 1)² − 4 y deduce el vértice.", "hint": "La mitad de −2 es −1. Comprueba desarrollando.", "steps": ["(x − 1)² = x² − 2x + 1.", "Para pasar de +1 a −3, resta 4.", "x² − 2x − 3 = (x − 1)² − 4.", "x − 1 = 0 → x = 1; y = −4. V(1,−4)."], "g": {"h": 1, "k": -4, "a": 1, "stage": "vertex", "xs": [-1, 0, 1, 2, 3]}}, {"group": "Minicontrol", "q": "5. Explica por qué y = −x² + 4 tiene dominio ℝ y recorrido (−∞, 4].", "hint": "¿Qué signo tiene un cuadrado? ¿Qué sucede al negarlo?", "steps": ["Cualquier real se puede elevar al cuadrado: D = ℝ.", "x² ≥ 0 → −x² ≤ 0 → −x² + 4 ≤ 4.", "En x = 0 se alcanza 4. Al crecer |x|, las alturas descienden sin límite.", "R = (−∞, 4]."], "g": {"h": 0, "k": 4, "a": -1, "stage": "range", "xs": [-2, -1, 0, 1, 2]}}, {"group": "Casa", "q": "1. y = (x − 3)² + 1: vértice, recorrido y cortes X e Y.", "hint": "Comprueba si el mínimo está encima o debajo del eje X.", "steps": ["x − 3 = 0 → x = 3; y = 1. V(3,1).", "Abre arriba; R = [1, +∞).", "X: 0 = (x − 3)² + 1 → (x − 3)² = −1. No hay solución real ni corte X.", "Y: (0 − 3)² + 1 = 9 + 1 = 10 → (0,10)."], "g": {"h": 3, "k": 1, "a": 1, "stage": "cuts", "xs": [1, 2, 3, 4, 5]}}, {"group": "Casa", "q": "2. y = −(x + 1)² + 9: vértice, cortes y recorrido.", "hint": "Resuelve x + 1 = 0; observa el signo exterior.", "steps": ["x + 1 = 0 → x = −1; y = 9. V(−1,9).", "Abre abajo: R = (−∞, 9].", "X: (x + 1)² = 9 → x + 1 = 3 o −3 → x = 2 o −4. Cortes (−4,0), (2,0).", "Y: −(0 + 1)² + 9 = 8 → (0,8)."], "g": {"h": -1, "k": 9, "a": -1, "stage": "cuts", "xs": [-3, -2, -1, 0, 1]}}, {"group": "Casa", "q": "3. y = x² − 6x + 5: expresa como (x − 3)² − 4; halla vértice y cortes X.", "hint": "La mitad de −6 es −3. Desarrolla y ajusta el término independiente.", "steps": ["(x − 3)² = x² − 6x + 9. Restamos 4 para obtener +5.", "y = (x − 3)² − 4; V(3,−4).", "X: (x − 3)² = 4 → x − 3 = 2 o −2 → x = 5 o 1.", "Cortes (1,0), (5,0). Alternativa: (x − 1)(x − 5) = 0."], "g": {"h": 3, "k": -4, "a": 1, "stage": "cuts", "xs": [1, 2, 3, 4, 5]}}, {"group": "Casa", "q": "4. Calcula f(2) y f(3) para f(x) = x² − 4x + 3.", "hint": "f(2) quiere decir sustituir x por 2; no multiplicar f por 2.", "steps": ["f(2) = 2² − 4·2 + 3 = 4 − 8 + 3 = −1.", "f(3) = 3² − 4·3 + 3 = 9 − 12 + 3 = 0.", "Puntos (2,−1) y (3,0). El primero es el vértice; el segundo, un corte X."], "g": {"h": 2, "k": -1, "a": 1, "stage": "cuts", "xs": [0, 1, 2, 3, 4]}}];let tab='learn',li=0,si=0,group='Práctica',teacher=false;const seen={};const main=document.getElementById('main');const fmt=n=>String(Object.is(n,-0)?0:n).replaceAll('-','−');const f=(g,x)=>g.a*(x-g.h)**2+g.k;const pos=(x,y)=>`(${fmt(x)}, ${fmt(y)})`;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function graph(g){if(!g)return '';const {h,k,a,stage}=g;const roots=(-k/a>=0)?[h-Math.sqrt(-k/a),h+Math.sqrt(-k/a)].filter((v,i,l)=>i===0||Math.abs(v-l[0])>1e-9):[];let xs=[0,h-2,h+2,...g.xs,...roots];if(g.ghost)xs.push(g.ghost[0]-2,g.ghost[0]+2);let xmin=Math.floor(Math.min(...xs))-1,xmax=Math.ceil(Math.max(...xs))+1;let ys=[0,k,...g.xs.map(x=>f(g,x))];if(['cuts','cutY'].includes(stage))ys.push(f(g,0));if(g.ghost)ys.push(g.ghost[1]);let ymin=Math.floor(Math.min(...ys))-2,ymax=Math.ceil(Math.max(...ys))+2;if(ymax-ymin<8){ymax+=1;ymin-=1;}const W=500,H=370,m=39;const sx=(W-2*m)/(xmax-xmin),sy=(H-2*m)/(ymax-ymin);const X=x=>m+(x-xmin)*sx,Y=y=>H-m-(y-ymin)*sy;const line=(x1,y1,x2,y2,c,w=1,d='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${d?'stroke-dasharray="'+d+'"':''}/>`;const txt=(x,y,t,c='#526177',anchor='middle')=>`<text x="${x}" y="${y}" font-size="12" fill="${c}" text-anchor="${anchor}">${esc(t)}</text>`;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plano cartesiano, parábola y sus elementos"><defs><clipPath id="clip${gid}"><rect x="${m}" y="${m}" width="${W-2*m}" height="${H-2*m}"/></clipPath></defs>`;let id=gid++;const clip=`clip${id}`;if(stage==='range'){let lo=a>0?k:ymin,hi=a>0?ymax:k;s+=`<rect x="${m}" y="${Y(hi)}" width="${W-2*m}" height="${Y(lo)-Y(hi)}" fill="#dff3ee"/>`;}for(let x=xmin;x<=xmax;x++){s+=line(X(x),m,X(x),H-m,'#e0e6ef');if(x!==0)s+=txt(X(x),Y(0)+15,fmt(x));}let ystep=Math.max(1,Math.ceil((ymax-ymin)/12));for(let y=Math.ceil(ymin/ystep)*ystep;y<=ymax;y+=ystep){s+=line(m,Y(y),W-m,Y(y),'#e0e6ef');if(y!==0)s+=txt(X(0)-7,Y(y)+4,fmt(y),'#526177','end');}s+=line(m,Y(0),W-m,Y(0),'#62718b',2)+line(X(0),m,X(0),H-m,'#62718b',2)+txt(W-m+14,Y(0)+4,'X','#17264b')+txt(X(0),m-12,'Y','#17264b')+txt(X(0)-8,Y(0)+15,'0','#526177','end');const curve=(fn,col,w=3,d='')=>{let arr=[];for(let i=0;i<=220;i++){let x=xmin+(xmax-xmin)*i/220;arr.push(`${i?'L':'M'}${X(x).toFixed(2)},${Y(fn(x)).toFixed(2)}`)}return `<path d="${arr.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" ${d?'stroke-dasharray="'+d+'"':''} clip-path="url(#${clip})"/>`};if(g.ghost){let [gh,gk,ga]=g.ghost;s+=curve(x=>ga*(x-gh)**2+gk,'#9aa7bf',2,'6 5');}if(stage==='compare')s+=curve(x=>2*x-5,'#a07131',3,'7 5');if(!['empty','single','points'].includes(stage))s+=curve(x=>f(g,x),'#087f81');if(stage==='symmetry'||stage==='shift')s+=line(X(h),m,X(h),H-m,'#6557af',2,'5 5')+txt(X(h)+5,m+13,'x = '+fmt(h),'#6557af','start');if(stage==='domain')s+=line(m,Y(0),W-m,Y(0),'#6557af',5)+txt(W/2,H-9,'← todos los valores de x →','#6557af');if(stage==='range')s+=line(X(0),Y(a>0?k:ymin),X(0),Y(a>0?ymax:k),'#6557af',5)+line(m,Y(k),W-m,Y(k),'#6557af',1.5,'5 5');const dot=(x,y,c,lab,dx=9,dy=-10)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="5.5" fill="${c}" stroke="white" stroke-width="1.5"/>${lab?txt(X(x)+dx,Y(y)+dy,lab,c,dx<0?'end':'start'):''}`;if(stage!=='empty'){for(const x of g.xs){s+=dot(x,f(g,x),'#6557af',(['points','single'].includes(stage)?pos(x,f(g,x)):'') ,x===Math.max(...g.xs)&&x>0?-8:8,-9);}}if(stage==='single'){const x=g.xs[0],y=f(g,x);s+=line(X(x),Y(0),X(x),Y(y),'#6557af',2,'4 4')+line(X(0),Y(y),X(x),Y(y),'#6557af',2,'4 4');}if(['vertex','symmetry','shift','range','cuts'].includes(stage))s+=dot(h,k,'#b04b52','V'+pos(h,k),h>=xmax-2?-9:9,a>0?18:-12);if(['cuts','cutX'].includes(stage)){roots.forEach((x,i)=>s+=dot(x,0,'#b04b52',pos(Number(x.toFixed(3)),0),i===0?-9:9,-10));}if(['cuts','cutY'].includes(stage))s+=dot(0,f(g,0),'#b04b52',pos(0,f(g,0)),9,-10);s+='</svg>';let legend=stage==='shift'?'Gris: curva anterior · verde: nueva curva':stage==='compare'?'Verde: parábola · ocre discontinuo: recta':stage==='range'?'Zona sombreada: alturas que alcanza la curva':stage==='domain'?'Morado: todos los valores horizontales de x':stage==='symmetry'?'Línea discontinua: eje de simetría':stage==='empty'?'Primero dibujamos los ejes.':stage==='points'?'Cada punto nuevo sale de sustituir un valor de x.':'Verde: curva · morado: puntos · rojo: puntos destacados';let table=['points','empty','single'].includes(stage)?`<table><tr><th>x</th>${g.xs.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr><tr><th>y</th>${g.xs.map(x=>`<td>${stage==='empty'?'?':fmt(f(g,x))}</td>`).join('')}</tr></table>`:'';return `<div class="graph">${s}${table}<div class="legend">${legend}</div></div>`;}
let gid=0;
function renderLearn(){const l=lessons[li],s=l.slides[si];const total=lessons.reduce((a,b)=>a+b.slides.length,0),current=lessons.slice(0,li).reduce((a,b)=>a+b.slides.length,0)+si+1;main.innerHTML=`<div class="layout"><aside class="side"><div class="small">ITINERARIO · elige un capítulo</div>${lessons.map((v,i)=>`<button data-lesson="${i}" class="${i===li?'active':''}">${String(i+1).padStart(2,'0')} · ${v.title}</button>`).join('')}</aside><section class="panel"><div class="stephead">Capítulo ${li+1} de ${lessons.length} · Paso ${si+1} de ${l.slides.length}</div><div class="progress"><div style="width:${100*current/total}%"></div></div><h2>${l.title}</h2><div class="small">${l.subtitle}</div><div class="${s.g?'split':''}"><div><h3>${s.title}</h3><p>${s.body}</p>${s.eq?`<div class="eq">${s.eq}</div>`:''}${s.tip?`<div class="tip"><strong>Comprueba:</strong> ${s.tip}</div>`:''}</div>${graph(s.g)}</div><div class="nav"><button id="prev" ${li===0&&si===0?'disabled':''}>← Anterior</button><span class="small">Paso ${current} / ${total}</span><button id="next" class="primary">${current===total?'Ir al laboratorio':'Siguiente paso →'}</button></div></section></div>`;main.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{li=+b.dataset.lesson;si=0;renderLearn()});document.getElementById('prev').onclick=()=>{if(si>0)si--;else if(li>0){li--;si=lessons[li].slides.length-1}renderLearn()};document.getElementById('next').onclick=()=>{if(si<l.slides.length-1)si++;else if(li<lessons.length-1){li++;si=0}else{setTab('lab');return}renderLearn()};}
function renderLab(){main.innerHTML=`<section class="panel"><div class="stephead">Experimenta</div><h2>Mueve la curva tú mismo</h2><p>Modifica un control cada vez. Observa cómo cambia el vértice, qué ocurre con las alturas y dónde aparecen los cortes.</p><div class="split"><div class="lab-controls"><label>Desplazamiento horizontal (h): <strong id="hv">2</strong><input id="h" type="range" min="-4" max="4" step="1" value="2"></label><label>Desplazamiento vertical (k): <strong id="kv">−1</strong><input id="k" type="range" min="-5" max="5" step="1" value="-1"></label><label>Apertura <select id="a"><option value="1">Hacia arriba (+)</option><option value="-1">Hacia abajo (−)</option></select></label><label>Destacar <select id="stage"><option value="symmetry">Vértice y simetría</option><option value="cuts">Cortes</option><option value="domain">Dominio</option><option value="range">Recorrido</option></select></label><button id="reset">Restablecer ejemplo A</button><div id="labresults" class="eq"></div></div><div id="labgraph"></div></div><div class="tip">Reto: consigue una parábola con vértice (−3, 2) y sin cortes con X. Después invierte la apertura. ¿Qué cambia?</div></section>`;function update(){let h=+document.getElementById('h').value,k=+document.getElementById('k').value,a=+document.getElementById('a').value,stage=document.getElementById('stage').value;document.getElementById('hv').textContent=fmt(h);document.getElementById('kv').textContent=fmt(k);let expr=(a<0?'−':'')+(h===0?'x²':`(x ${h>0?'−':'+'} ${Math.abs(h)})²`)+(k===0?'':` ${k>0?'+':'−'} ${Math.abs(k)}`);let r=-k/a,roots=r<0?[]:r===0?[h]:[h-Math.sqrt(r),h+Math.sqrt(r)];document.getElementById('labresults').innerHTML=`y = ${expr}<br>V${pos(h,k)} · eje x = ${fmt(h)}<br>D = ℝ<br>R = ${a>0?'['+fmt(k)+', +∞)':'(−∞, '+fmt(k)+']'}<br><span class="small">Cortes X: ${roots.length?roots.map(x=>pos(+x.toFixed(3),0)).join(', '):'ninguno'}<br>Corte Y: ${pos(0,a*h*h+k)} · raíces no enteras aproximadas a 3 decimales</span>`;document.getElementById('labgraph').innerHTML=graph({h,k,a,stage,xs:[h-2,h-1,h,h+1,h+2]});}['h','k','a','stage'].forEach(id=>document.getElementById(id).oninput=update);document.getElementById('reset').onclick=()=>{document.getElementById('h').value=2;document.getElementById('k').value=-1;document.getElementById('a').value=1;document.getElementById('stage').value='symmetry';update()};update();}
function renderPractice(){main.innerHTML=`<section class="panel"><div class="stephead">Entrenamiento · cuaderno original</div><h2>Hazlo tú, paso a paso</h2><p>Resuelve en papel primero. En práctica y casa puedes pedir una pista; el minicontrol mantiene las soluciones y pistas ocultas hasta activar la corrección.</p><div class="groupnav">${['Práctica','Minicontrol','Casa'].map(g=>`<button class="${g===group?'active':''}" data-group="${g}">${g}</button>`).join('')}</div>${group==='Minicontrol'?`<div class="tip">15–20 minutos · 5 ejercicios · sin apuntes. <button id="teacher">${teacher?'Volver al modo sin ayuda':'He terminado: activar corrección'}</button></div>`:''}<div id="items">${exercises.map((e,i)=>e.group===group?`<article class="exercise"><h3>${e.q}</h3>${group!=='Minicontrol'||teacher?`<div class="actions"><button data-hint="${i}">Ver pista</button><button data-step="${i}" class="primary">Mostrar primer paso</button><button data-reset="${i}">Ocultar solución</button></div><div id="hint${i}" class="tip hidden">${e.hint}</div><div id="sol${i}" class="solution"></div>`:'<p class="note">Escribe el procedimiento completo en tu cuaderno antes de corregir.</p>'}<label class="small">Registro: <select data-record="${i}"><option value="">Sin registrar</option><option>Sola</option><option>Con pista</option><option>Todavía no</option></select></label></article>`:'').join('')}</div><p class="note" id="record"></p></section>`;main.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;teacher=false;renderPractice()});let t=document.getElementById('teacher');if(t)t.onclick=()=>{teacher=!teacher;renderPractice()};main.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>document.getElementById('hint'+b.dataset.hint).classList.toggle('hidden'));main.querySelectorAll('[data-step]').forEach(b=>{let i=+b.dataset.step,n=0,e=exercises[i],sol=document.getElementById('sol'+i);b.onclick=()=>{n=Math.min(n+1,e.steps.length);sol.innerHTML=`<ol>${e.steps.slice(0,n).map(v=>`<li>${v}</li>`).join('')}</ol>${n===e.steps.length?graph(e.g):''}`;b.textContent=n===e.steps.length?'Solución completa':`Mostrar paso ${n+1} de ${e.steps.length}`;b.disabled=n===e.steps.length};main.querySelector('[data-reset="'+i+'"]').onclick=()=>{n=0;sol.innerHTML='';b.disabled=false;b.textContent='Mostrar primer paso';document.getElementById('hint'+i).classList.add('hidden')}});function records(){let ids=exercises.map((e,i)=>e.group===group?i:-1).filter(i=>i>=0);document.getElementById('record').textContent=`Registro de este bloque: ${ids.filter(i=>seen[i]==='Sola').length} sola · ${ids.filter(i=>seen[i]==='Con pista').length} con pista · ${ids.filter(i=>seen[i]==='Todavía no').length} todavía no. Se conserva mientras esta página permanezca abierta.`}main.querySelectorAll('[data-record]').forEach(s=>{s.value=seen[s.dataset.record]||'';s.onchange=()=>{seen[s.dataset.record]=s.value;records()}});records();}
function renderReference(){main.innerHTML=`<section class="panel"><div class="stephead">Resumen para el cuaderno</div><h2>¿Qué hago cuando me dan una parábola?</h2><p>Para expresiones de esta clase, y = ±(x − h)² + k.</p><div class="reference"><article><h3>1. Vértice</h3>Iguala el paréntesis a cero para hallar x; sustituye para hallar y. V(h, k).</article><article><h3>2. Apertura y eje</h3>Signo positivo: arriba, mínimo. Negativo: abajo, máximo. Eje: x = h.</article><article><h3>3. Tabla</h3>Elige h − 2, h − 1, h, h + 1, h + 2. Sustituye y marca (x, y).</article><article><h3>4. Cortes</h3>Y: pon x = 0. X: pon y = 0. Resuelve y escribe las parejas.</article><article><h3>5. Dominio</h3>D = ℝ para toda parábola de esta clase.</article><article><h3>6. Recorrido</h3>Arriba: [k, +∞). Abajo: (−∞, k]. k es la altura, nunca h.</article></div><div class="quiz"><h3>Comprobación rápida</h3>${[['Para (x + 3)² − 2, ¿cuál es el vértice?',['(3, −2)','(−3, −2)','(−3, 2)'],1,'x + 3 = 0 → x = −3; y = −2.'],['Para −x² + 4, ¿cuál es el recorrido?',['[4, +∞)','ℝ','(−∞, 4]'],2,'La parábola abre abajo y 4 es su máximo.'],['Para hallar el corte con Y, ¿qué pones a cero?',['x','y','Las dos'],0,'El eje Y está donde x = 0.']].map((q,i)=>`<div class="exercise"><strong>${q[0]}</strong><div>${q[1].map((v,j)=>`<button data-quiz="${i},${j},${q[2]}" data-explain="${q[3]}">${v}</button>`).join('')}</div><div id="feedback${i}" role="status"></div></div>`).join('')}</div></section>`;main.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{let [i,j,k]=b.dataset.quiz.split(',');document.getElementById('feedback'+i).textContent=(j===k?'Correcto. ':'Vuelve a intentarlo. ')+b.dataset.explain});}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-pressed',String(b.dataset.tab===t))});({learn:renderLearn,lab:renderLab,practice:renderPractice,reference:renderReference}[t])();}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));setTab('learn');
</script></body></html>
